<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Hệ Thống Quản Lý & Tổng Hợp Bộ Tiêu Chí Đoàn Cấp Cơ Sở</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0052cc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tiêu Chí Đoàn" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./favicon.png" />

  <link rel="stylesheet" href="./styles.css?v=1792216777" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./qrcode.min.js"></script>
  <!-- OneSignal Web Push SDK v16 (Hỗ trợ thông báo nổi màn hình khi tắt web/tắt máy) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root" style="position:relative; z-index:9999999 !important;"></div>
  <div id="toast-root" class="toast-container"></div>
  <script src="./app.js?v=1792216777"></script>
  <script>
    // 0. Tự động kiểm tra bản cập nhật và dọn sạch cache cũ trên điện thoại
    const CURRENT_BUILD_TS = 1792216777;
    (async function autoUpdatePWA() {
      try {
        const lastTs = Number(localStorage.getItem('doan2026_pwa_ts')) || 0;
        if (lastTs < CURRENT_BUILD_TS) {
          localStorage.setItem('doan2026_pwa_ts', String(CURRENT_BUILD_TS));
          if ('caches' in window) {
            const keys = await caches.keys();
            for (let k of keys) await caches.delete(k);
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let r of regs) {
              await r.update().catch(() => {});
            }
          }
          if (lastTs > 0) {
            window.location.replace(window.location.origin + window.location.pathname + '?v=' + CURRENT_BUILD_TS);
            return;
          }
        }
      } catch (e) {}
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const dir = (parts.length > 0 && !parts[0].includes('.')) ? '/' + parts[0] + '/' : '/';
        const swPath = dir + 'OneSignalSDKWorker.js';
        navigator.serviceWorker.register(swPath, { scope: dir }).then(function (reg) {
          if (reg && reg.update) reg.update();
        }).catch(function (err) {
          console.log('SW reg error:', err);
        });
      });
    }

    // 2. Hàm ép xóa sạch toàn bộ Cache và nạp bản mới nhất
    window.forceClearCacheAndReload = async function () {
      try {
        if (window.showToast) {
          showToast('Đang xóa sạch Cache & tải bản mới nhất...', 'info');
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let r of registrations) {
            await r.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let k of keys) {
            await caches.delete(k);
          }
        }
      } catch (err) {
        console.warn('Lỗi xóa cache:', err);
      }
      const cleanUrl = window.location.origin + window.location.pathname + '?reload=' + Date.now();
      window.location.replace(cleanUrl);
    };
  </script>
</body>
</html>
