    (function() {
      try {
        var unlock = function() {
          try {
            if (localStorage.getItem('doan2026_bg_music_muted') === '1' || localStorage.getItem('doan2026_bg_music_paused') === '1') {
              return;
            }
          } catch(e) {}
          if (window.BgMusicManager && window.BgMusicManager.currentTrack && !window.BgMusicManager.isLocallyMuted() && !window.BgMusicManager.isLocallyPaused()) {
            window.BgMusicManager.unlockAndPlay();
          }
          ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function(evt) {
            window.removeEventListener(evt, unlock, true);
            document.removeEventListener(evt, unlock, true);
          });
        };
        ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, unlock, { passive: true, capture: true });
          document.addEventListener(evt, unlock, { passive: true, capture: true });
        });
      } catch(e) {}
    })();

  <script>
    // 0. Tự động kiểm tra bản cập nhật và dọn sạch cache cũ trên điện thoại / App PWA
    const CURRENT_BUILD_TS = 1795761509647;
    (async function autoUpdatePWA() {
      try {
        const lastTs = Number(localStorage.getItem('doan2026_pwa_ts')) || 0;
        if (lastTs > 0 && lastTs < CURRENT_BUILD_TS) {
          localStorage.setItem('doan2026_pwa_ts', String(CURRENT_BUILD_TS));
          if ('caches' in window) {
            const keys = await caches.keys();
            for (let k of keys) await caches.delete(k);
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let r of regs) {
              await r.update().catch(() => {});
            }
          }
          // Tự động làm mới với query timestamp để Safari / Chrome trên điện thoại nạp ngay bản mã nguồn mới
          const cleanUrl = window.location.origin + window.location.pathname + '?v=' + CURRENT_BUILD_TS;
          window.location.replace(cleanUrl);
          return;
        } else if (lastTs === 0) {
          localStorage.setItem('doan2026_pwa_ts', String(CURRENT_BUILD_TS));
        }
      } catch (e) {}
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const dir = (parts.length > 0 && !parts[0].includes('.')) ? '/' + parts[0] + '/' : '/';
        const swPath = dir + 'OneSignalSDKWorker.js';
        navigator.serviceWorker.register(swPath, { scope: dir }).then(function (reg) {
          if (reg && reg.update) reg.update();
        }).catch(function (err) {
          console.log('SW reg error:', err);
        });
      });
    }

    // 2. Hàm ép xóa sạch toàn bộ Cache và nạp bản mới nhất
    window.forceClearCacheAndReload = async function () {
      try {
        if (window.showToast) {
          showToast('Đang xóa sạch Cache & tải bản mới nhất...', 'info');
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let r of registrations) {
            await r.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let k of keys) {
            await caches.delete(k);
          }
        }
      } catch (err) {
        console.warn('Lỗi xóa cache:', err);
      }
      const cleanUrl = window.location.origin + window.location.pathname + '?reload=' + Date.now();
      window.location.replace(cleanUrl);
    };
  </script>
